# Hermes plugin-catalog entry for this provider.
#
# Not read by anything here — it is the file WE PR into NousResearch/hermes-agent as
# `plugin-catalog/hindsight.yaml`. Submitting the catalog entry is the receiving
# maintainer's job (ours), not Nous'.
#
# It must land BEFORE (or with) their removal of the bundled `plugins/memory/hindsight/`:
# `hermes_cli/memory_provider_migration.py` looks the provider up by name in the catalog
# when it can no longer find it on disk, and without an entry every existing user gets
#
#   ⚠ Memory provider 'hindsight' is configured but not installed and not in the plugin catalog.
#
# instead of an automatic install on `hermes update`.
#
# `repo`/`subdir` point at this monorepo — the live source for the provider.
#
# `sha` must be a 40-char commit on vectorize-io/hindsight main that contains the
# provider directory this entry points at — the catalog only installs reviewed pins.
# Bump it (and `version`) in a follow-up PR whenever the provider changes.
name: hindsight
repo: https://github.com/vectorize-io/hindsight
sha: 0000000000000000000000000000000000000000  # set to the release commit before opening the PR
subdir: hindsight-integrations/hermes
version: "1.0.0"
description: Long-term memory with knowledge graph, entity resolution, and multi-strategy retrieval. Cloud, local embedded, or local external.
maintainer: vectorize-io
tier: community
category: memory
docs_url: https://hindsight.vectorize.io/sdks/integrations/hermes
# Memory providers surface their tools through `get_tool_schemas()`, not `register(ctx)`,
# so the capability probe records zero registrations. Declaring any here would fail
# `hermes plugins validate`'s declared-vs-registered check.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
